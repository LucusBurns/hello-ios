name: HelloIOS
options:
  bundleIdPrefix: com.example
targets:
  HelloIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [HelloIOS]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.example.helloios
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_ENTITLEMENTS: HelloIOS/HelloIOS.entitlements
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
